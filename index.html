<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A productivity dashboard with timer, tasks, and quick links">
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle">
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle between light and dark theme" aria-pressed="false">
            🌙
        </button>
    </div>

    <div class="container">
        <!-- Greeting Component -->
        <header class="greeting-section" role="banner">
            <div id="greeting-message" class="greeting-text" aria-live="polite"></div>
            <div id="current-time" class="time-display" aria-live="off" aria-label="Current time"></div>
            <div id="current-date" class="date-display" aria-label="Current date"></div>
        </header>

        <main class="dashboard-grid" role="main">
            <!-- Timer Component -->
            <section class="timer-section card" aria-labelledby="timer-heading">
                <h2 id="timer-heading">Focus Timer</h2>
                <div id="timer-display" class="timer-display" role="timer" aria-live="off" aria-atomic="true" aria-label="Timer display showing remaining time">25:00</div>
                <div class="timer-controls" role="group" aria-label="Timer controls">
                    <button id="timer-start" class="btn btn-primary" aria-label="Start focus timer">Start</button>
                    <button id="timer-stop" class="btn btn-secondary" aria-label="Stop focus timer">Stop</button>
                    <button id="timer-reset" class="btn btn-secondary" aria-label="Reset focus timer to initial duration">Reset</button>
                </div>
                <div class="timer-duration-control">
                    <label for="timer-duration-input">Duration (minutes):</label>
                    <input 
                        type="number" 
                        id="timer-duration-input" 
                        class="input-field" 
                        min="1" 
                        max="120" 
                        value="25"
                        aria-label="Set timer duration in minutes"
                        aria-describedby="timer-duration-hint"
                    >
                    <span id="timer-duration-hint" class="visually-hidden">Enter a value between 1 and 120 minutes</span>
                </div>
            </section>

            <!-- Tasks Component -->
            <section class="tasks-section card" aria-labelledby="tasks-heading">
                <h2 id="tasks-heading">Tasks</h2>
                <div class="task-input-group" role="group" aria-label="Add new task">
                    <input 
                        type="text" 
                        id="task-input" 
                        class="input-field" 
                        placeholder="Add a new task..."
                        aria-label="Enter new task description"
                    >
                    <button id="task-add" class="btn btn-primary" aria-label="Add task to list">Add</button>
                    <button id="task-sort" class="btn btn-secondary" aria-label="Sort tasks by completion status">Sort</button>
                </div>
                <ul id="task-list" class="task-list" role="list" aria-label="Task list"></ul>
            </section>

            <!-- Links Component -->
            <section class="links-section card" aria-labelledby="links-heading">
                <h2 id="links-heading">Quick Links</h2>
                <div class="link-input-group" role="group" aria-label="Add new quick link">
                    <input 
                        type="url" 
                        id="link-url" 
                        class="input-field" 
                        placeholder="URL (e.g., https://example.com)"
                        aria-label="Enter link URL"
                        aria-required="true"
                    >
                    <input 
                        type="text" 
                        id="link-label" 
                        class="input-field" 
                        placeholder="Label (optional)"
                        aria-label="Enter link label (optional)"
                    >
                    <button id="link-add" class="btn btn-primary" aria-label="Add link to quick links">Add</button>
                </div>
                <div id="links-container" class="links-container" role="list" aria-label="Quick links list"></div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
